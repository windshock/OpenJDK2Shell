spec:
  containers:
  - args:
    - |
      set -u
      if [ "$ARM" = "A2" ]; then
        until [ -x /share/jdk1721/jdk/bin/java ]; do echo "APP-WAITING-JDK1721"; sleep 5; done
        JAVA_BIN=/share/jdk1721/jdk/bin/java
      else
        JAVA_BIN=/opt/java/openjdk/bin/java
      fi
      apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq maven >/dev/null 2>&1
      mkdir -p /build/src/main/java/lab && cp /v/pom.xml /build/ && cp /v/AvatarApp.java /build/src/main/java/lab/
      cd /build && mvn -q -B package -DskipTests 2>&1 | tail -3
      XFLAGS=""
      [ "$ARM" = "A3" ] && XFLAGS="-XX:-UseBASE64Intrinsics"
      echo "APP-SUPERVISOR-START arm=$ARM java_bin=$JAVA_BIN"
      "$JAVA_BIN" -version 2>&1 | head -2
      while true; do
        GCLOG="/share/gc_$(date -u +%Y%m%dT%H%M%SZ).log"
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) jvm_start gclog=$GCLOG arm=$ARM" >> /share/episode_log.txt
        "$JAVA_BIN" --add-opens java.xml/com.sun.org.apache.xalan.internal.xsltc.trax=ALL-UNNAMED \
          --add-opens java.xml/com.sun.org.apache.xalan.internal.xsltc.runtime=ALL-UNNAMED \
          --add-opens java.xml/com.sun.org.apache.xml.internal.dtm=ALL-UNNAMED \
          --add-opens java.xml/com.sun.org.apache.xml.internal.serializer=ALL-UNNAMED \
          -Xms1280m -Xmx1280m -Xlog:gc,gc+heap=info:file=$GCLOG:time,uptime,level,tags \
          -XX:ErrorFile=/share/hs_err_pid%p.log $XFLAGS \
          -jar target/avatar-svc-1.0.jar 2>&1 | grep -vE 'Initializing|Completed init'
        rc=${PIPESTATUS[0]}
        echo "$rc" > /share/last_exit
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) java_exit=$rc arm=$ARM" >> /share/episode_log.txt
        sleep 2
      done
    command:
    - /bin/bash
    - -c
